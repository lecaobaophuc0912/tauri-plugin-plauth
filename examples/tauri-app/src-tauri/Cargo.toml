[package]
name = "tauri-app"
version = "0.1.0"
description = "Example Tauri application demonstrating plauth plugin usage"
authors = ["Phuc Le <lecaobaophuc0912@gmail.com>"]
license = "MIT"
repository = "https://github.com/lecaobaophuc0912/tauri-plugin-plauth"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.3.1", default-features = false , features = [] }

[dependencies]
tauri = { version = "2.7.0", features = [] }
tauri-plugin-plauth = { path = "../../../" }

